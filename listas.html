<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de Lista</title>
</head>
<body>
    <h1>Elementos de Lista</h1>
    <p>
        As listas em HTML são utilizadas para organizar informações em uma sequencia.
    </p>
    <h2>-----Lista Não Ordenadas-----</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>
    <h2>-----Listas Ordenadas-----</h2>
    <ol>
        <li>Primeiro item</li>
        <li>Segundo item</li>
        <li>Terceiro item</li>
        <li>Quarto item</li>
    </ol>
    
</body>
</html>
