<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estudo de Classes</title>

    <style>
        .titulo{
            color: darkblue;
            text-align: center;
        }
        .caixa01{
            background-color:  rgb(213, 253, 253);
            border: 2px solid darkblue;
            padding: 20px;
            margin: 20px;
        }
        .caixa02{
            background-color: rgb(243, 208, 219);
            border: 2px solid darkmagenta;
            padding: 20px;
            margin: 20px;
        }
        .paragrafo1{
            color:darkblue;
            font-weight: bold;
        }
        .paragrafo2{
            color:darkmagenta;
            background-color: rgb(228, 197, 228);
            font-style: oblique;
            padding: 10px;
        }
    </style>

</head>

<body>

    <h1 class="titulo">
        Estudando Classes com CSS
    </h1>

    <div class="caixa01">
        <p class="paragrafo1">
            Este é o primeiro parágrafo da primeira div.
        </p>

        <p class="paragrafo2">
            Este é o segundo parágrafo da primeira div.
        </p>
    </div>

    <div class="caixa02">
        <p class="paragrafo1">
            Este é o único parágrafo da segunda div.
        </p>
    </div>

</body>
</html>
