<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de 0 até 9</title>
</head>
<body>
    <h1>Contador de 0 até 9</h1>

    <p>O programa exibirá os números de 0 até 9</p>

    <div id = "resultado"></div>

    <script>
        const resultado = document.getElementById("resultado");

        for (let contator = 0; contator < 10; contator++){
            resultado.innerHTML += `<p> Número: ${contator} <\p>`;
        }
    </script>
</body>
</html>
