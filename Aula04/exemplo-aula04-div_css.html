<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div, br e hr</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal {
            background-color: rgb(183, 129, 233);
            border: 2px solid rgb(132, 30, 226);
            color: white;
        }
        #segundaria {
            background-color: rgb(125, 218, 235);
            border: 2px solid rgb(42, 160, 228);
            color: white;
        }
        hr{
            border: none;
            border-top: 3px solid rgb(207, 182, 235);
            width: 90%;
        }

    </style>

</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id="segundaria" >
        Esta é outra divisão da página.
        <br>
        Aqui começa uma nova linha. 
    </div>
</body>
</html>
